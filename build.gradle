plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }

    maven { url = "https://cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }

    maven { url = "https://maven.ryanhcode.dev/releases" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.squiddev.cc" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"

    runtimeOnly "maven.modrinth:nvQzSEkH:eYz2YBGT"

    runtimeOnly("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    runtimeOnly("net.createmod.ponder:ponder-neoforge:1.0.85+mc1.21.1")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6")
    runtimeOnly("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")

    runtimeOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:1.1.3")
    runtimeOnly("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.5.0")
    runtimeOnly("foundry.veil:veil-neoforge-1.21.1:3.6.2")

    runtimeOnly("dev.eriksonn.aeronautics:aeronautics-neoforge-1.21.1:1.1.0") {
        transitive = false
    }
    runtimeOnly("dev.simulated_team.simulated:simulated-neoforge-1.21.1:1.1.0") {
        transitive = false
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
